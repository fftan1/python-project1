name: Python CI

on: 
  push:
    branches: 
      - main
    
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  lint:
    runs-on: ubuntu-latest

    steps:
        - name: Checkout code
          uses: actions/checkout@v6

        - name: Setup Python
          uses: actions/setup-python@v6

        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install ruff

        - name: Run Ruff linter
          run: |
            ruff check .

        - name: Check code format
          run: |
            ruff format --check .

